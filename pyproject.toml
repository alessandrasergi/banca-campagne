[project]
name = "banca-campagne"
version = "0.1.0"
description = "Chi chiamiamo nella prossima campagna, e con quale numero lo diciamo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.3",
    "pandas>=3.1",
    "tabulate>=0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
